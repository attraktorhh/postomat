# Synapse config for LOCAL DEVELOPMENT ONLY. Never use these settings in production.
server_name: "localhost"
public_baseurl: "http://localhost:8008/"
pid_file: /data/homeserver.pid
report_stats: false
suppress_key_server_warning: true
trusted_key_servers: []          # no federation, never contact matrix.org

listeners:
  - port: 8008
    type: http
    tls: false
    bind_addresses: ["0.0.0.0"]
    x_forwarded: false
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

log_config: "/config/log.config"
media_store_path: /data/media_store
signing_key_path: "/data/localhost.signing.key"
macaroon_secret_key: "postomat-dev-macaroon-secret"
form_secret: "postomat-dev-form-secret"

# Accounts
enable_registration: false
registration_shared_secret: "postomat-dev-registration-secret"
password_config:
  enabled: true
  localdb_enabled: true

# E2EE on by default for every new room
encryption_enabled_by_default_for_room_type: all

# No federation / no phoning home
federation_domain_whitelist: []
url_preview_enabled: false
enable_metrics: false
presence:
  enabled: true

# Relaxed rate limits for local testing
rc_message:
  per_second: 1000
  burst_count: 10000
rc_registration:
  per_second: 1000
  burst_count: 10000
rc_registration_token_validity:
  per_second: 1000
  burst_count: 10000
rc_login:
  address:
    per_second: 1000
    burst_count: 10000
  account:
    per_second: 1000
    burst_count: 10000
  failed_attempts:
    per_second: 1000
    burst_count: 10000
rc_admin_redaction:
  per_second: 1000
  burst_count: 10000
rc_joins:
  local:
    per_second: 1000
    burst_count: 10000
  remote:
    per_second: 1000
    burst_count: 10000
rc_joins_per_room:
  per_second: 1000
  burst_count: 10000
rc_invites:
  per_room:
    per_second: 1000
    burst_count: 10000
  per_user:
    per_second: 1000
    burst_count: 10000
  per_issuer:
    per_second: 1000
    burst_count: 10000
rc_3pid_validation:
  per_second: 1000
  burst_count: 10000
rc_media_create:
  per_second: 1000
  burst_count: 10000
rc_room_creation:
  per_second: 1000
  burst_count: 10000
rc_reports:
  per_second: 1000
  burst_count: 10000
rc_presence:
  per_user:
    per_second: 1000
    burst_count: 10000
rc_delayed_event_mgmt:
  per_second: 1000
  burst_count: 10000
rc_key_requests:
  per_second: 1000
  burst_count: 10000
